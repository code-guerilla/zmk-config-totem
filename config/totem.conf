# --- 1. Split- & Bluetooth-Reichweiten-Fix (+8 dBm) ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n

# --- 2. Corporate Windows BLE Kompatibilitäts-Fixes ---
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# --- 3. Native Miryoku Mouse-Emulation (Zephyr 4 / ZMK Pointing) ---
CONFIG_ZMK_POINTING=y

# --- 4. ZMK Studio (wird für links per build.yaml aktiviert, hier nur entsperren) ---
CONFIG_ZMK_STUDIO_LOCKING=n

# --- 5. Energie & Debounce ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
